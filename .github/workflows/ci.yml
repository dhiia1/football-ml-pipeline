name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

      # TODO: once evaluate.py compares against MLflow directly, add a step
      # here that fails the build if a newly trained model doesn't beat the
      # baseline — that's the real "ML gate" beyond just code tests.
